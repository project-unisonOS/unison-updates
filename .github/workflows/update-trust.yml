name: Update trust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metadata-attacks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned cryptography dependency
        run: python -m pip install cryptography==49.0.0
      - name: Run signed metadata attack simulations
        run: ./scripts/test_trusted_metadata.py
